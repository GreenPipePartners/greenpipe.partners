<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" style="background-color:#ffffff" width="2200" height="1240" viewBox="0 0 2200 1240" role="img"><title>washheat-calculation-flow-rev-o</title><rect x="0" y="0" width="2200" height="1240" fill="#ffffff" stroke="#ffffff" stroke-width="2" /><rect x="0" y="0" width="2200" height="8" fill="#236940" stroke="#236940" stroke-width="2" /><text x="40" y="62.0" fill="#236940" font-size="32" font-family="Liberation Sans, Arial, sans-serif">WashHeat / source-backed calculations</text><text x="40" y="98.0" fill="#52685c" font-size="19" font-family="Liberation Sans, Arial, sans-serif">Ignition calculates and persists; PLC supplies physical-source timing · FM497 Rev 5 + FM20 Rev 57</text><rect x="40" y="160" width="720" height="290" fill="#eaf1ec" stroke="#236940" stroke-width="2" /><text x="62" y="201.0" fill="#236940" font-size="25" font-family="Liberation Sans, Arial, sans-serif">FM497 input contract</text><text x="62" y="239.0" fill="#193b2d" font-size="21" font-family="Liberation Sans, Arial, sans-serif">D10 OD · D16 blocker height · inches</text><text x="62" y="265.25" fill="#193b2d" font-size="21" font-family="Liberation Sans, Arial, sans-serif">D30 inscribed circle · optional</text><text x="62" y="291.5" fill="#193b2d" font-size="21" font-family="Liberation Sans, Arial, sans-serif">t = cumulative out-of-furnace seconds</text><text x="62" y="317.75" fill="#193b2d" font-size="21" font-family="Liberation Sans, Arial, sans-serif">across wash episodes in the same run</text><text x="62" y="432.0" fill="#236940" font-size="17" font-family="Liberation Sans, Arial, sans-serif">Source observations; press arrival advisory ±1 s</text><rect x="840" y="160" width="1320" height="290" fill="#eaf1ec" stroke="#236940" stroke-width="2" /><text x="862" y="201.0" fill="#236940" font-size="25" font-family="Liberation Sans, Arial, sans-serif">Strict full-reheat boundary</text><text x="862" y="239.0" fill="#193b2d" font-size="21" font-family="Liberation Sans, Arial, sans-serif">t &gt; 300 s  →  70 FULL_REHEAT_REQUIRED</text><text x="862" y="265.25" fill="#193b2d" font-size="21" font-family="Liberation Sans, Arial, sans-serif">t ≤ 300 s  →  calculate applicable candidates</text><text x="862" y="291.5" fill="#193b2d" font-size="21" font-family="Liberation Sans, Arial, sans-serif">No duration is invented for a full-reheat hold.</text><text x="862" y="432.0" fill="#236940" font-size="17" font-family="Liberation Sans, Arial, sans-serif">The 300-second boundary itself remains calculated</text><polyline points="760,300 840,300" fill="none" stroke="#236940" stroke-width="2.5" /><polyline points="828.2941876694152,305.654551943446 840,300 828.2941876694152,294.345448056554" fill="none" stroke="#236940" stroke-width="2.5" /><rect x="40" y="500" width="2120" height="300" fill="#ffffff" stroke="#236940" stroke-width="2" /><text x="65" y="553.0" fill="#236940" font-size="30" font-family="Liberation Sans, Arial, sans-serif">FM497 governing requirement</text><text x="65" y="606.0" fill="#193b2d" font-size="26" font-family="Liberation Mono, monospace">OD     = 12 + 2.99 × OD     − 5.01 × 2 + 0.16 × t</text><text x="65" y="651.0" fill="#193b2d" font-size="26" font-family="Liberation Mono, monospace">Height = 12 + 2.99 × Height − 5.01     + 0.16 × t</text><text x="65" y="696.0" fill="#193b2d" font-size="26" font-family="Liberation Mono, monospace">Circle = 12 + 2.99 × Circle − 5.01     + 0.16 × t  [optional]</text><text x="65" y="741.0" fill="#193b2d" font-size="26" font-family="Liberation Mono, monospace">Required minutes = max(45, min(applicable candidates)); seconds = minutes × 60</text><rect x="40" y="845" width="2120" height="310" fill="#eaf1ec" stroke="#236940" stroke-width="2" /><text x="65" y="898.0" fill="#236940" font-size="30" font-family="Liberation Sans, Arial, sans-serif">FM20 / maximum Cycle Start time</text><text x="65" y="962.0" fill="#193b2d" font-size="30" font-family="Liberation Mono, monospace">Max Transfer + DH Cycle Start − DH Tonnage time − 3 seconds</text><text x="65" y="1016.0" fill="#193b2d" font-size="26" font-family="Liberation Sans, Arial, sans-serif">All three inputs are elapsed seconds. DH Tonnage is a timing value, not press force.</text><text x="65" y="1063.0" fill="#193b2d" font-size="25" font-family="Liberation Sans, Arial, sans-serif">Persist exact positive milliseconds → bound FDC limit → strict elapsed &gt; limit → CDL warning.</text><text x="65" y="1114.0" fill="#236940" font-size="24" font-family="Liberation Sans, Arial, sans-serif">Eligible Cycle Start: no wash. Explicit wash decision wins within the ±1-second window.</text><text x="40" y="1213.0" fill="#52685c" font-size="23" font-family="Liberation Sans, Arial, sans-serif">Readiness uses the correlated PLC return stopwatch and remaining qualifying-soak budget; expiry alone never chooses a wash.</text></svg>