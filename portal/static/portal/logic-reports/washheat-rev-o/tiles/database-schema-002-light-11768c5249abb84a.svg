/text><text x="2820" y="4185.0" fill="#193b2d" font-size="24" font-family="Liberation Mono, monospace">NN</text><text x="2955" y="4183.0" fill="#193b2d" font-size="22" font-family="Liberation Mono, monospace">—</text><text x="3170" y="4183.0" fill="#193b2d" font-size="22" font-family="Liberation Mono, monospace">DEFAULT SYSUTCDATETIME()</text><polyline points="2110,4205 3850,4205" fill="none" stroke="#236940" stroke-width="2.5" /><text x="2132" y="4237.0" fill="#193b2d" font-size="22" font-family="Liberation Mono, monospace">PRIMARY KEY (run_id, episode_no, record_revision)</text><text x="2132" y="4294.0" fill="#52685c" font-size="20" font-family="Liberation Sans, Arial, sans-serif">001_washheat.sql · line 42 · exact DDL in report appendix</text><text x="140" y="4452.0" fill="#52685c" font-size="22" font-family="Liberation Sans, Arial, sans-serif">Declared FK actions: NO ACTION on update/delete. Nullable FKs permit zero parents; unique/PK child keys bound parent-to-child cardinality.</text><text x="140" y="4495.0" fill="#52685c" font-size="22" font-family="Liberation Sans, Arial, sans-serif">JSON columns retain the full run, identity, calculation, event and sample objects. No fictitious SQL columns are inferred from JSON members.</text></svg>