<svg xmlns="http://www.w3.org/2000/svg" style="background-color:#07110e" width="7340" height="1089.0" viewBox="0 130 7340 1089" role="img"><title>washheat-message-translations-rev-o</title><rect x="0" y="0" width="7340" height="12938" fill="#07110e" stroke="#07110e" stroke-width="2" /><text x="60" y="272.0" fill="#69e69d" font-size="32" font-family="Liberation Sans, Arial, sans-serif">P50 / SLXDCMsg</text><text x="60" y="320.0" fill="#edf8f1" font-size="23" font-family="Liberation Sans, Arial, sans-serif">Array stays DINT[4]. Press → FDC writes [2..3]: 2 DINT / 8 bytes. FDC → press writes [0..1].</text><text x="60" y="362.0" fill="#edf8f1" font-size="23" font-family="Liberation Sans, Arial, sans-serif">Exact MSG tags, configuration and routes are retained. Press Cycle Start time is FDC ARRIVAL, advisory ±1 second.</text><text x="60" y="404.0" fill="#edf8f1" font-size="23" font-family="Liberation Sans, Arial, sans-serif">One-second decision grace precedes cycle publication. Original arrival timestamp is retained.</text><text x="60" y="474.0" fill="#8da69b" font-size="22" font-family="Liberation Sans, Arial, sans-serif">SOURCE / TRANSFERRED FIELD</text><text x="1450" y="474.0" fill="#8da69b" font-size="22" font-family="Liberation Sans, Arial, sans-serif">TYPE / TRANSLATION</text><text x="2460" y="474.0" fill="#8da69b" font-size="22" font-family="Liberation Sans, Arial, sans-serif">DESTINATION</text><rect x="50" y="499" width="3560" height="80" fill="#0d241d" stroke="#0d241d" stroke-width="2" /><text x="60" y="533.0" fill="#71b7ff" font-size="26" font-family="Liberation Mono, monospace">P5000DataCtrlWord[0]</text><text x="1450" y="533.0" fill="#edf8f1" font-size="26" font-family="Liberation Mono, monospace">Existing FDC commands / handshake</text><text x="2460" y="533.0" fill="#69e69d" font-size="26" font-family="Liberation Mono, monospace">P5000DataCtrlWord[0]</text><text x="60" y="615.0" fill="#71b7ff" font-size="26" font-family="Liberation Mono, monospace">P5000DataCtrlWord[1]</text><text x="1450" y="615.0" fill="#edf8f1" font-size="26" font-family="Liberation Mono, monospace">Existing companion word</text><text x="2460" y="615.0" fill="#69e69d" font-size="26" font-family="Liberation Mono, monospace">P5000DataCtrlWord[1]</text><rect x="50" y="663" width="3560" height="80" fill="#0d241d" stroke="#0d241d" stroke-width="2" /><text x="60" y="697.0" fill="#71b7ff" font-size="26" font-family="Liberation Mono, monospace">P5000DataCtrlWord[2]</text><text x="1450" y="697.0" fill="#edf8f1" font-size="26" font-family="Liberation Mono, monospace">Existing press status; bit 0 heartbeat</text><text x="2460" y="697.0" fill="#69e69d" font-size="26" font-family="Liberation Mono, monospace">P5000DataCtrlWord[2]</text><text x="60" y="779.0" fill="#71b7ff" font-size="26" font-family="Liberation Mono, monospace">P5000DataCtrlWord[3]</text><text x="1450" y="779.0" fill="#edf8f1" font-size="26" font-family="Liberation Mono, monospace">NEW persistent Cycle Start counter</text><text x="2460" y="779.0" fill="#69e69d" font-size="26" font-family="Liberation Mono, monospace">P5000DataCtrlWord[3]</text><rect x="50" y="827" width="3560" height="80" fill="#0d241d" stroke="#0d241d" stroke-width="2" /><text x="60" y="861.0" fill="#71b7ff" font-size="26" font-family="Liberation Mono, monospace">Local:2:I.Data[9].25 rising</text><text x="1450" y="861.0" fill="#edf8f1" font-size="26" font-family="Liberation Mono, monospace">Increment [3] once; wrap 2147483646 → 1</text><text x="2460" y="861.0" fill="#69e69d" font-size="26" font-family="Liberation Mono, monospace">WH_NewLinkEvent[1]</text><text x="60" y="943.0" fill="#71b7ff" font-size="26" font-family="Liberation Mono, monospace">Counter change arrives</text><text x="1450" y="943.0" fill="#edf8f1" font-size="26" font-family="Liberation Mono, monospace">FDC WALLCLOCKTIME.DateTime</text><text x="2460" y="943.0" fill="#69e69d" font-size="26" font-family="Liberation Mono, monospace">WH_Link[1/2].EventUTC[0..6]</text>