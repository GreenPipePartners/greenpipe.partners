<svg xmlns="http://www.w3.org/2000/svg" style="background-color:#ffffff" width="7340" height="1089" viewBox="0 11020 7340 1089" role="img"><title>washheat-message-translations-rev-o</title><rect x="0" y="0" width="7340" height="12938" fill="#ffffff" stroke="#ffffff" stroke-width="2" /><text x="60" y="11116.0" fill="#236940" font-size="32" font-family="Liberation Sans, Arial, sans-serif">FDC / process barcode → exact dimension lookup</text><text x="60" y="11164.0" fill="#193b2d" font-size="23" font-family="Liberation Sans, Arial, sans-serif">Small photographed barcode: FCBHAH05 (serial only). Larger PDF417 contains 11 comma-separated fields; NO DIMENSIONS.</text><text x="60" y="11206.0" fill="#193b2d" font-size="23" font-family="Liberation Sans, Arial, sans-serif">FDC funcParseBarCodeData → funcProcessFurnaceItem → original RF01/RF02 item. Stage 00213 stays text.</text><text x="60" y="11248.0" fill="#193b2d" font-size="23" font-family="Liberation Sans, Arial, sans-serif">Heat QA (strQA) is not press quality (strPressQA). No broad QA-only or inferred-dimension fallback.</text><text x="60" y="11318.0" fill="#52685c" font-size="22" font-family="Liberation Sans, Arial, sans-serif">SOURCE / TRANSFERRED FIELD</text><text x="1450" y="11318.0" fill="#52685c" font-size="22" font-family="Liberation Sans, Arial, sans-serif">TYPE / TRANSLATION</text><text x="2460" y="11318.0" fill="#52685c" font-size="22" font-family="Liberation Sans, Arial, sans-serif">DESTINATION</text><rect x="50" y="11343" width="3560" height="80" fill="#eaf1ec" stroke="#eaf1ec" stroke-width="2" /><text x="60" y="11377.0" fill="#1764a6" font-size="26" font-family="Liberation Mono, monospace">[00] FCBHAH05</text><text x="1450" y="11377.0" fill="#193b2d" font-size="26" font-family="Liberation Mono, monospace">Serial → sFurnaceItem.strSN</text><text x="2460" y="11377.0" fill="#236940" font-size="26" font-family="Liberation Mono, monospace">serial_number</text><text x="60" y="11459.0" fill="#1764a6" font-size="26" font-family="Liberation Mono, monospace">[01] P/024236</text><text x="1450" y="11459.0" fill="#193b2d" font-size="26" font-family="Liberation Mono, monospace">Work order → sFurnaceItem.strWO</text><text x="2460" y="11459.0" fill="#236940" font-size="26" font-family="Liberation Mono, monospace">work_order</text><rect x="50" y="11507" width="3560" height="80" fill="#eaf1ec" stroke="#eaf1ec" stroke-width="2" /><text x="60" y="11541.0" fill="#1764a6" font-size="26" font-family="Liberation Mono, monospace">[02] 00213</text><text x="1450" y="11541.0" fill="#193b2d" font-size="26" font-family="Liberation Mono, monospace">Stage → sFurnaceItem.strStg</text><text x="2460" y="11541.0" fill="#236940" font-size="26" font-family="Liberation Mono, monospace">stage</text><text x="60" y="11623.0" fill="#1764a6" font-size="26" font-family="Liberation Mono, monospace">[03] 22G0436-01</text><text x="1450" y="11623.0" fill="#193b2d" font-size="26" font-family="Liberation Mono, monospace">Part number → sFurnaceItem.strPN</text><text x="2460" y="11623.0" fill="#236940" font-size="26" font-family="Liberation Mono, monospace">part_number</text><rect x="50" y="11671" width="3560" height="80" fill="#eaf1ec" stroke="#eaf1ec" stroke-width="2" /><text x="60" y="11705.0" fill="#1764a6" font-size="26" font-family="Liberation Mono, monospace">[04] NCR36941-HFF2</text><text x="1450" y="11705.0" fill="#193b2d" font-size="26" font-family="Liberation Mono, monospace">Heat specification → sFurnaceItem.strQA</text><text x="2460" y="11705.0" fill="#236940" font-size="26" font-family="Liberation Mono, monospace">qa_spec</text><text x="60" y="11787.0" fill="#1764a6" font-size="26" font-family="Liberation Mono, monospace">[05] 1690</text><text x="1450" y="11787.0" fill="#193b2d" font-size="26" font-family="Liberation Mono, monospace">Barcode temperature → sFurnaceItem.strBarCodeTemperature</text><text x="2460" y="11787.0" fill="#236940" font-size="26" font-family="Liberation Mono, monospace">temperature_sp</text><rect x="50" y="11835" width="3560" height="80" fill="#eaf1ec" stroke="#eaf1ec" stroke-width="2" /><text x="60" y="11869.0" fill="#1764a6" font-size="26" font-family="Liberation Mono, monospace">[06] 25</text><text x="1450" y="11869.0" fill="#193b2d" font-size="26" font-family="Liberation Mono, monospace">Temperature tolerance → sFurnaceItem.strTolerance</text><text x="2460" y="11869.0" fill="#236940" font-size="26" font-family="Liberation Mono, monospace">temperature_tolerance</text><text x="60" y="11951.0" fill="#1764a6" font-size="26" font-family="Liberation Mono, monospace">[07] 340</text><text x="1450" y="11951.0" fill="#193b2d" font-size="26" font-family="Liberation Mono, monospace">Minimum soak (minutes) → sFurnaceItem.strSoak</text><text x="2460" y="11951.0" fill="#236940" font-size="26" font-family="Liberation Mono, monospace">min_soak_minutes</text><rect x="50" y="11999" width="3560" height="80" fill="#eaf1ec" stroke="#eaf1ec" stroke-width="2" /><text x="60" y="12033.0" fill="#1764a6" font-size="26" font-family="Liberation Mono, monospace">[08] 654</text><text x="1450" y="12033.0" fill="#193b2d" font-size="26" font-family="Liberation Mono, monospace">Maximum soak (minutes) → sFurnaceItem.strMaxSoak</text><text x="2460" y="12033.0" fill="#236940" font-size="26" font-family="Liberation Mono, monospace">max_soak_minutes</text><text x="60" y="12115.0" fill="#1764a6" font-size="26" font-family="Liberation Mono, monospace">[09] 22G0436-01-F1-02</text><text x="1450" y="12115.0" fill="#193b2d" font-size="26" font-family="Liberation Mono, monospace">Press recipe → sFurnaceItem.strRecipe</text><text x="2460" y="12115.0" fill="#236940" font-size="26" font-family="Liberation Mono, monospace">press_recipe</text></svg>